    <text x="24" y="36" font-family="'Courier New', monospace" font-size="14" fill="#475569"># exam.py</text>
    <text x="24" y="66" font-family="'Courier New', monospace" font-size="18" fill="#3B82F6" font-weight="bold">def study():</text>
    <text x="24" y="94" font-family="'PingFang SC', 'Courier New', monospace" font-size="18" fill="#FFD43B">    print("上岸")</text>
