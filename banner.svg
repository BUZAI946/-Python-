    <text x="24" y="150" font-family="'Courier New', monospace" font-size="18" fill="#3B82F6" font-weight="bold">for p in range(90):</text>
    <text x="24" y="178" font-family="'Courier New', monospace" font-size="18" fill="#FFD43B">    note = take_note(p)</text>
    <text x="24" y="206" font-family="'Courier New', monospace" font-size="18" fill="#FFFFFF">    review(note)</text>
    <text x="24" y="234" font-family="'Courier New', monospace" font-size="18" fill="#3B82F6" font-weight="bold">    if ready:</text>
    <text x="24" y="262" font-family="'Courier New', monospace" font-size="18" fill="#10B981">        pass_exam()</text>
    <text x="24" y="290" font-family="'Courier New', monospace" font-size="18" fill="#FFFFFF">    </text>
    <text x="24" y="318" font-family="'PingFang SC', 'Courier New', monospace" font-size="18" fill="#10B981" font-weight="bold">study()  # 一次上岸</text>
  </g>

